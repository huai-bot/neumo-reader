# 发布流程：仅在推送版本 tag（如 v0.1.1）时运行一次。
# - 不设定时任务（schedule），普通 push / PR 都不会触发
# - 只构建 Windows x64，同一时间只跑一个
# - fork 出去的仓库不会运行（见 if 条件）
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  windows:
    if: github.repository == 'huai-bot/floral-reader'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 检查版本号与 tag 一致
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $pkg = (Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          $cargo = [regex]::Match((Get-Content src-tauri/Cargo.toml -Raw -Encoding utf8), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          "tag=$tag package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          if ($pkg -ne $tag -or $conf -ne $tag -or $cargo -ne $tag) {
            Write-Error "版本号与 tag 不一致，请先运行 npm run version:set -- $tag 并提交"
            exit 1
          }

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 构建安装包
        run: npx tauri build

      - name: 生成便携版
        shell: pwsh
        run: ./scripts/pack-portable.ps1 -Version "${{ github.ref_name }}"

      - name: 发布到 Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          $src = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $src) { Write-Error "没有找到安装包"; exit 1 }
          $setup = "FloralReader_${ver}_x64-setup.exe"
          Copy-Item $src.FullName $setup
          $portable = "src-tauri/target/release/portable/FloralReader_${ver}_x64-portable.zip"
          if (-not (Test-Path $portable)) { Write-Error "没有找到便携版"; exit 1 }
          Copy-Item $portable .
          $portable = Split-Path $portable -Leaf
          $shaSetup = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $shaPortable = (Get-FileHash $portable -Algorithm SHA256).Hash.ToLower()

          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          $range = if ($LASTEXITCODE -eq 0 -and $prev) { "$prev..$tag" } else { $tag }
          $changes = (git log $range --no-merges --pretty="- %s") -join "`n"
          if (-not $changes) { $changes = "- 例行更新" }

          $lines = @(
            "## 拟物阅读 $tag",
            "",
            "### 更新内容",
            $changes,
            "",
            "### 下载",
            "| 文件 | 说明 | SHA-256 |",
            "| --- | --- | --- |",
            "| ``$setup`` | 安装版：安装到当前用户，无需管理员权限，注册 .md / .txt 打开方式 | ``$shaSetup`` |",
            "| ``$portable`` | 便携版：解压即用，数据保存在软件目录的 data 文件夹 | ``$shaPortable`` |",
            "",
            "> 需要 Windows 10/11 x64 与 WebView2 运行时（系统一般已预装）。安装包未做代码签名，首次运行时 SmartScreen 可能提示，选择「更多信息 → 仍要运行」即可。"
          )
          Set-Content notes.md ($lines -join "`n") -Encoding utf8NoBOM

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $portable --clobber
          } else {
            gh release create $tag $setup $portable --title "拟物阅读 $tag" --notes-file notes.md --verify-tag
          }
